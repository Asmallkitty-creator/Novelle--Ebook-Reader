name: Novelle build & release

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'   # weekly: keeps the signing key from expiring

permissions:
  contents: write

concurrency:
  group: novelle-build
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ks
          key: novelle-signing-key-v1

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      NV_PASS: novelle-ks-pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Signing key (restore, or create on the very first build)
        id: ks
        uses: actions/cache@v4
        with:
          path: ks
          key: novelle-signing-key-v1

      - name: Create signing key (first build only)
        if: steps.ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ks
          keytool -genkeypair -keystore ks/novelle.jks -alias novelle -keyalg RSA -keysize 2048 -validity 36500 -storepass "$NV_PASS" -keypass "$NV_PASS" -dname "CN=Novelle, O=Novelle, C=RO"

      - name: Unpack novelle-android.zip
        run: |
          mkdir _x
          unzip -q novelle-android.zip -d _x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: _x/nv
        run: npm install

      - name: Prepare web assets
        working-directory: _x/nv
        run: |
          mkdir -p www/lib
          cp node_modules/jszip/dist/jszip.min.js node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/
          cp src/index.html www/index.html
          sed -i 's#https://cdnjs[^"]*/jszip.min.js#lib/jszip.min.js#; s#https://cdnjs[^"]*/pdf.min.js#lib/pdf.min.js#' www/index.html
          sed -i 's#</body>#<script>pdfjsLib.GlobalWorkerOptions.workerSrc="lib/pdf.worker.min.js"</script></body>#' www/index.html
          sed -i "s#__BUILD__#${{ github.run_number }}#; s#__REPO__#${{ github.repository }}#" www/index.html

      - name: Add Android
        working-directory: _x/nv
        run: npx cap add android

      - name: Icons
        working-directory: _x/nv
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#120c26'

      - name: Sync
        working-directory: _x/nv
        run: npx cap sync android

      - name: Build APK
        working-directory: _x/nv/android
        env:
          NV_KS: ${{ github.workspace }}/ks/novelle.jks
          NV_BUILD: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp _x/nv/android/app/build/outputs/apk/debug/app-debug.apk Novelle.apk
          gh release create "build-${{ github.run_number }}" Novelle.apk --title "Novelle build ${{ github.run_number }}" --notes-file _x/nv/RELEASE_NOTES.md --target "${{ github.sha }}" --latest
